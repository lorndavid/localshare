services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-localshare}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-localshare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-localshare}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:?PROVIDER_ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

  web-dashboard:
    build:
      context: ../..
      dockerfile: apps/web-dashboard/Dockerfile
    restart: always
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - api
      - web-dashboard
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # Optional: If you pass CLOUDFLARE_TUNNEL_TOKEN in .env and run with `--profile tunnel`,
  # Docker will run the Cloudflare Tunnel connector directly inside this Compose network.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    profiles:
      - tunnel
    depends_on:
      - nginx
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  pgdata_prod:

